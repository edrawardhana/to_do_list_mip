services:
  db:
    image: postgres:15-alpine
    container_name: todolist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: todolist_backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: todolist
      DB_USERNAME: postgres
      DB_PASSWORD: localpassword
      DB_SSLMODE: disable
      SUPABASE_STORAGE_KEY: ""
      SUPABASE_STORAGE_SECRET: ""
      SUPABASE_STORAGE_URL: ""
      APP_URL: http://10.10.20.5:8005
      FRONTEND_URL: http://10.10.20.5:8080,http://localhost:8080
    env_file:
      - ./Backend/.env
    depends_on:
      - db
    volumes:
      - ./Backend/storage:/var/www/html/storage
      - ./Backend/bootstrap/cache:/var/www/html/bootstrap/cache

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://10.10.20.5:8005/api
    container_name: todolist_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
