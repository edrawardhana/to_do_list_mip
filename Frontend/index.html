<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mip Activity</title>

    <!-- Mengambil font yang mirip dari Google Fonts -->
    <!-- 'Yellowtail' untuk Mip (cursive), 'Inter' untuk activity! (bold sans-serif) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Inter:wght@900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --dark-blue: #030a1c; /* Warna biru gelap login Anda */
        --yellow-mip: #facc15; /* Warna kuning Mip */
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        /* TRANSISI GELAP KE TERANG (Dengan Grid Halus) */
        animation: bgDarkToLight 2s forwards;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        transition: opacity 1s ease;
      }

      .logo-container {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      /* KATA 1: Mip (Persis seperti gambar) */
      .mip {
        font-family: "Yellowtail", cursive;
        color: var(--yellow-mip);
        font-size: 4.5rem;
        opacity: 0;
        transform: translateY(15px);
        animation: fadeIn 0.8s ease-out 0.5s forwards;
        text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      /* KATA 2: activity! (Persis seperti gambar) */
      .activity {
        font-family: "Inter", sans-serif;
        color: #ffffff;
        font-size: 3.8rem;
        font-weight: 900;
        letter-spacing: -3px; /* Merapatkan huruf agar persis gambar */
        opacity: 0;
        transform: translateY(15px);
        animation: fadeIn 0.8s ease-out 1.3s forwards;
        text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      /* Animasi Background Gelap ke Biru Login */
      @keyframes bgDarkToLight {
        0% {
          background-color: #000000;
        }
        100% {
          background-color: var(--dark-blue);
        }
      }

      /* Animasi Muncul Halus */
      @keyframes fadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--dark-blue);
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="logo-container">
        <span class="mip">Mip</span>
        <span class="activity">activity!</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      function closeSplash() {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.style.opacity = "0";
          setTimeout(() => {
            splash.style.display = "none";
            document.body.style.overflow = "auto";
          }, 1000);
        }
      }

      // 0.5s Mip muncul
      // 1.3s activity! muncul
      // 3.0s mulai transisi halus ke login page
      setTimeout(closeSplash, 3000);
    </script>
  </body>
</html>
