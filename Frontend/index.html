<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Identik: Yellowtail (Mip) & Inter (activity) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Inter:wght@900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>InternSync</title>

    <style>
      :root {
        --dark-blue: #030a1c;
        --yellow-mip: #facc15;
      }

      /* CSS UNTUK SPLASH SCREEN */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        animation: bgDarkToLight 2s forwards;
        opacity: 1;
        transition: opacity 0.8s ease-in-out;
        background-color: #000;
      }

      .logo-text {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .mip {
        font-family: "Yellowtail", cursive;
        color: var(--yellow-mip);
        font-size: 4.5rem;
        opacity: 0;
        transform: translateY(15px);
        animation: wordFadeIn 0.8s ease-out 0.5s forwards;
      }

      .activity {
        font-family: "Inter", sans-serif;
        color: #ffffff;
        font-size: 3.8rem;
        font-weight: 900;
        letter-spacing: -3px;
        opacity: 0;
        transform: translateY(15px);
        animation: wordFadeIn 0.8s ease-out 1.2s forwards;
      }

      @keyframes bgDarkToLight {
        to {
          background-color: var(--dark-blue);
        }
      }

      @keyframes wordFadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-out-splash {
        opacity: 0 !important;
        pointer-events: none;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- 1. DIV SPLASH SCREEN -->
    <div id="splash-screen">
      <div class="logo-text">
        <span class="mip">Mip</span>
        <span class="activity">activity!</span>
      </div>
    </div>

    <!-- 2. DIV ROOT -->
    <div id="root"></div>

    <!-- 3. SCRIPT REACT -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- 4. LOGIKA PENGHAPUS SPLASH -->
    <script>
      function removeSplash() {
        const splash = document.getElementById("splash-screen");
        if (splash) {
          splash.classList.add("fade-out-splash");
          // Hapus elemen dari DOM setelah animasi fade selesai
          setTimeout(() => {
            splash.remove();
          }, 800);
        }
      }
      // Mulai menghapus splash screen setelah 2.5 detik
      setTimeout(removeSplash, 2500);
    </script>
  </body>
</html>
